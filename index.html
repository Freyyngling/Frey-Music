<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freyの音楽実験室</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(10, 10, 30, 0.60);
    --glass-border: rgba(255,255,255,0.08);
    --accent1: #00f0ff;
    --accent2: #a855f7;
    --accent3: #f472b6;
    --text: #e2e8f0;
    --text-dim: rgba(226,232,240,0.45);
    --radius: 18px;
    --banner-h: 200px;
    --viz-h: 90px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #000;
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── 全画面暗背景 ── */
  #bg-dark {
    position: fixed;
    inset: 0;
    background: #050510;
    z-index: 0;
  }

  /* ── バナー動画エリア ── */
  #banner-wrap {
    position: relative;
    width: 100%;
    height: var(--banner-h);
    overflow: hidden;
    flex-shrink: 0;
    z-index: 2;
  }

  #bg-video {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  /* バナー下部フェードアウト */
  #banner-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(to bottom, transparent, #050510);
    z-index: 3;
  }

  /* ── ビジュアライザー（バナー下端に重なる） ── */
  #visualizer {
    position: relative;
    width: 100%;
    height: var(--viz-h);
    z-index: 4;
    flex-shrink: 0;
    margin-top: -30px;
    pointer-events: none;
  }

  /* ── 全体レイアウト ── */
  #app {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── タイトル（バナー上に重ねる） ── */
  #site-title {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.2rem, 2.5vw, 1.9rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    white-space: nowrap;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradShift 6s linear infinite;
    filter: drop-shadow(0 0 16px rgba(0,240,255,0.5)) drop-shadow(0 2px 8px rgba(0,0,0,0.8));
  }

  @keyframes gradShift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* ── メインコンテンツ（ビジュアライザー下） ── */
  #main-content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 10px;
    padding: 8px 14px 10px;
    min-height: 0;
    overflow: hidden;
  }

  /* ── プレイヤーパネル ── */
  #player-panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: var(--radius);
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 8px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow-y: auto;
    scrollbar-width: none;
  }
  #player-panel::-webkit-scrollbar { display: none; }

  .now-playing-label {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent1);
    font-family: 'Orbitron', sans-serif;
  }

  #track-title {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.3;
    color: #fff;
    text-shadow: 0 0 20px rgba(0,240,255,0.3);
  }

  #track-artist {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: -8px;
  }

  /* ── シークバー ── */
  .seek-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 20px;
    background: transparent;
    outline: none;
    cursor: pointer;
    padding: 0;
    margin: 0;
    display: block;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent1) var(--prog, 0%), rgba(255,255,255,0.12) var(--prog, 0%));
  }
  input[type=range]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent1);
    box-shadow: 0 0 8px var(--accent1);
    cursor: pointer;
    margin-top: -6px;
    transition: transform 0.15s;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent1);
    box-shadow: 0 0 8px var(--accent1);
    border: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  /* ── 再生ボタン群 ── */
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 8px;
    border-radius: 50%;
    transition: color 0.2s, transform 0.15s, text-shadow 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:hover { color: var(--accent1); transform: scale(1.15); text-shadow: 0 0 12px var(--accent1); }
  .ctrl-btn.active { color: var(--accent1); text-shadow: 0 0 10px var(--accent1); }

  .play-btn {
    width: 54px; height: 54px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none;
    border-radius: 50%;
    color: #000;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(0,240,255,0.4);
    transition: transform 0.15s, box-shadow 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 36px rgba(0,240,255,0.6); }

  /* ── 音量・速度列 ── */
  .vol-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-label {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
    display: flex;
    justify-content: space-between;
  }
  .slider-label span { color: var(--accent1); }

  /* ── 背景動画コントロール ── */
  .bg-ctrl {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bg-ctrl-title {
    font-size: 0.60rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent2);
    font-family: 'Orbitron', sans-serif;
  }

  .bg-ctrl-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bg-select {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.78rem;
    outline: none;
    cursor: pointer;
  }

  .mute-btn {
    background: none;
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .mute-btn:hover, .mute-btn.muted { color: var(--accent3); border-color: var(--accent3); }

  /* ── サイドバー ── */
  #sidebar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    min-height: 0;
  }

  .panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .panel-title {
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
  }
  .panel-title.cyan { color: var(--accent1); }
  .panel-title.pink { color: var(--accent3); }

  .panel-actions {
    display: flex;
    gap: 4px;
  }

  .mini-btn {
    background: none;
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.0rem;
    padding: 6px 10px;
    border-radius: 8px;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
    min-width: 38px;
    text-align: center;
  }
  .mini-btn:hover { color: var(--accent1); border-color: var(--accent1); background: rgba(0,240,255,0.06); }
  .mini-btn.active { color: var(--accent1); border-color: var(--accent1); background: rgba(0,240,255,0.08); }

  .track-list {
    list-style: none;
    overflow-y: scroll;
    flex: 1;
    min-height: 0;
    scrollbar-width: auto;
    scrollbar-color: rgba(0,240,255,0.3) rgba(255,255,255,0.05);
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
  }
  .track-list::-webkit-scrollbar { width: 6px; }
  .track-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 3px; }
  .track-list::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.35); border-radius: 3px; }
  .track-list::-webkit-scrollbar-thumb:hover { background: rgba(0,240,255,0.6); }

  .track-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    touch-action: pan-y;
    min-height: 48px;
  }
  .track-item:hover { background: rgba(255,255,255,0.06); }
  .track-item.active { background: rgba(0,240,255,0.08); }
  .track-item.active .track-name { color: var(--accent1); }
  .track-item.dragging {
    opacity: 0.4;
    background: rgba(0,240,255,0.05);
  }
  .track-item.drag-over {
    border-top: 2px solid var(--accent1);
  }

  .drag-handle {
    color: rgba(0,240,255,0.45);
    font-size: 1.3rem;
    cursor: grab;
    padding: 4px 6px;
    flex-shrink: 0;
    opacity: 0.6;
    transition: opacity 0.2s, color 0.2s;
    min-width: 32px;
    text-align: center;
    line-height: 1;
    touch-action: none;
  }
  .track-item:hover .drag-handle { opacity: 1; color: var(--accent1); }
  .drag-handle:active { cursor: grabbing; color: var(--accent3); }

  .track-num {
    font-size: 0.70rem;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .track-item.active .track-num { color: var(--accent1); }

  .track-info { flex: 1; min-width: 0; }
  .track-name {
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .track-artist-small {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .fav-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 6px 8px;
    flex-shrink: 0;
    transition: color 0.2s, transform 0.15s;
    min-width: 36px;
    text-align: center;
  }
  .fav-btn:hover { transform: scale(1.2); }
  .fav-btn.favorited { color: var(--accent3); }

  /* ── 再生中インジケーター ── */
  .playing-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    width: 14px;
  }
  .playing-bars span {
    display: block;
    width: 3px;
    background: var(--accent1);
    border-radius: 1px;
    animation: barBounce 0.8s ease-in-out infinite;
  }
  .playing-bars span:nth-child(2) { animation-delay: 0.15s; }
  .playing-bars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes barBounce {
    0%, 100% { height: 3px; }
    50% { height: 12px; }
  }

  /* ── ローディング ── */
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    transition: opacity 0.6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent1);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">LOADING...</div>
</div>

<div id="bg-dark"></div>

<div id="app">

  <!-- タイトル（バナー上に浮かせる） -->
  <div id="site-title">Freyの音楽実験室</div>

  <!-- バナー動画 -->
  <div id="banner-wrap">
    <video id="bg-video" autoplay muted loop playsinline></video>
    <div id="banner-fade"></div>
  </div>

  <!-- ビジュアライザー（バナー下端と重なる） -->
  <canvas id="visualizer"></canvas>

  <!-- メインUI -->
  <div id="main-content">

    <!-- プレイヤーパネル -->
    <div id="player-panel">

      <div>
        <div class="now-playing-label">▶ NOW PLAYING</div>
        <div id="track-title">曲を選択してください</div>
        <div id="track-artist">—</div>
      </div>

      <div class="seek-wrap">
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="btn-shuffle" title="シャッフル">⇄</button>
        <button class="ctrl-btn" id="btn-prev" title="前の曲">⏮</button>
        <button class="play-btn" id="btn-play" title="再生/一時停止">▶</button>
        <button class="ctrl-btn" id="btn-next" title="次の曲">⏭</button>
        <button class="ctrl-btn" id="btn-repeat" title="リピート">↺</button>
      </div>

      <div class="vol-row">
        <div class="slider-group">
          <div class="slider-label">🔊 音楽音量 <span id="vol-val">80%</span></div>
          <input type="range" id="music-vol" min="0" max="100" value="80">
        </div>
        <div class="slider-group">
          <div class="slider-label">⚡ 再生速度 <span id="speed-val">1.0x</span></div>
          <input type="range" id="speed-ctrl" min="0.5" max="2.0" value="1.0" step="0.1">
        </div>
      </div>

      <div class="bg-ctrl">
        <div class="bg-ctrl-title">🎬 背景動画</div>
        <div class="bg-ctrl-row">
          <select class="bg-select" id="bg-select"></select>
          <button class="mute-btn" id="bg-mute-btn">🔇 ミュート</button>
        </div>
        <div class="slider-group">
          <div class="slider-label">🔊 動画音量 <span id="bg-vol-val">30%</span></div>
          <input type="range" id="bg-vol" min="0" max="100" value="30">
        </div>
        <div class="slider-group">
          <div class="slider-label">💡 透明度 <span id="bg-opacity-val">45%</span></div>
          <input type="range" id="bg-opacity" min="0" max="100" value="45">
        </div>
        <div class="slider-group">
          <div class="slider-label">📐 バナー高さ <span id="banner-h-val">200px</span></div>
          <input type="range" id="banner-h-ctrl" min="80" max="380" value="200" step="10">
        </div>
      </div>

    </div><!-- /player-panel -->

    <!-- サイドバー -->
    <div id="sidebar">

      <div class="panel">
        <div class="panel-header">
          <div class="panel-title cyan">📋 プレイリスト</div>
          <div class="panel-actions">
            <button class="mini-btn" id="pl-shuffle" title="シャッフル">⇄</button>
            <button class="mini-btn" id="pl-repeat" title="リピート">↺</button>
          </div>
        </div>
        <ul class="track-list" id="playlist-ul"></ul>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="panel-title pink">♥ お気に入り <span style="font-size:0.55rem;color:var(--text-dim);font-family:sans-serif;letter-spacing:0;">長押しで並び替え</span></div>
          <div class="panel-actions">
            <button class="mini-btn" id="fav-shuffle" title="シャッフル">⇄</button>
            <button class="mini-btn" id="fav-repeat" title="リピート">↺</button>
          </div>
        </div>
        <ul class="track-list" id="favorites-ul"></ul>
      </div>

    </div>

  </div><!-- /main-content -->
</div><!-- /app -->

<audio id="audio-el"></audio>

<script>
// ══════════════════════════════════════════════
//  状態管理
// ══════════════════════════════════════════════
const state = {
  playlist: [],
  favOrder: [],       // お気に入りの独自順序（playlist内インデックス）
  currentIndex: -1,
  isPlaying: false,
  shuffle: false,
  repeat: 'none',
  plShuffle: false,
  plRepeat: 'none',
  favShuffle: false,
  favRepeat: 'none',
  activeList: 'main',
  bgMuted: false,
  backgrounds: [],
  currentBg: 0,
};

// ══════════════════════════════════════════════
//  DOM参照
// ══════════════════════════════════════════════
const audio        = document.getElementById('audio-el');
const bgVideo      = document.getElementById('bg-video');
const bannerWrap   = document.getElementById('banner-wrap');
const canvas       = document.getElementById('visualizer');
const ctx2d        = canvas.getContext('2d');
const loading      = document.getElementById('loading');

const titleEl      = document.getElementById('site-title');
const trackTitle   = document.getElementById('track-title');
const trackArtist  = document.getElementById('track-artist');
const seekBar      = document.getElementById('seek-bar');
const timeCur      = document.getElementById('time-current');
const timeTot      = document.getElementById('time-total');

const btnPlay      = document.getElementById('btn-play');
const btnPrev      = document.getElementById('btn-prev');
const btnNext      = document.getElementById('btn-next');
const btnShuffle   = document.getElementById('btn-shuffle');
const btnRepeat    = document.getElementById('btn-repeat');

const musicVol     = document.getElementById('music-vol');
const volVal       = document.getElementById('vol-val');
const speedCtrl    = document.getElementById('speed-ctrl');
const speedVal     = document.getElementById('speed-val');

const bgSelect     = document.getElementById('bg-select');
const bgMuteBtn    = document.getElementById('bg-mute-btn');
const bgVolSlider  = document.getElementById('bg-vol');
const bgVolVal     = document.getElementById('bg-vol-val');
const bgOpacity    = document.getElementById('bg-opacity');
const bgOpacityVal = document.getElementById('bg-opacity-val');
const bannerHCtrl  = document.getElementById('banner-h-ctrl');
const bannerHVal   = document.getElementById('banner-h-val');

const playlistUl   = document.getElementById('playlist-ul');
const favoritesUl  = document.getElementById('favorites-ul');
const plShuffle    = document.getElementById('pl-shuffle');
const plRepeat     = document.getElementById('pl-repeat');
const favShuffle   = document.getElementById('fav-shuffle');
const favRepeat    = document.getElementById('fav-repeat');

// ══════════════════════════════════════════════
//  初期化
// ══════════════════════════════════════════════
async function init() {
  try {
    const cfg = await fetch('config.json').then(r => r.json());
    titleEl.textContent = cfg.title || 'Freyの音楽実験室';
    document.title = cfg.title || 'Freyの音楽実験室';
    state.backgrounds = cfg.backgrounds || [];
    state.backgrounds.forEach((bg, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = bg.split('/').pop().replace('.mp4','');
      bgSelect.appendChild(opt);
    });
  } catch(e) { console.warn('config.json 読み込み失敗:', e); }

  try {
    if (state.backgrounds.length > 0) setBg(0);
  } catch(e) { console.warn('背景動画設定失敗:', e); }

  try {
    const pl = await fetch('playlist.json').then(r => r.json());
    state.playlist = pl;
    // お気に入り順序を初期化
    state.favOrder = pl.map((t,i) => i).filter(i => pl[i].favorite);
    renderLists();
  } catch(e) { console.warn('playlist.json 読み込み失敗:', e); }

  setTimeout(() => loading.classList.add('hidden'), 600);
  setupVisualizer();
}

// ══════════════════════════════════════════════
//  背景動画
// ══════════════════════════════════════════════
function setBg(idx) {
  state.currentBg = idx;
  bgVideo.src = state.backgrounds[idx];
  bgVideo.load();
  bgVideo.play().catch(()=>{});
  bgSelect.value = idx;
  updateBgAudio();
}

function updateBgAudio() {
  try {
    bgVideo.muted = state.bgMuted;
    bgVideo.volume = state.bgMuted ? 0 : bgVolSlider.value / 100;
  } catch(e) {}
}

bgSelect.addEventListener('change', () => setBg(parseInt(bgSelect.value)));

bgMuteBtn.addEventListener('click', () => {
  state.bgMuted = !state.bgMuted;
  bgMuteBtn.textContent = state.bgMuted ? '🔊 解除' : '🔇 ミュート';
  bgMuteBtn.classList.toggle('muted', state.bgMuted);
  updateBgAudio();
});

bgVolSlider.addEventListener('input', () => {
  bgVolVal.textContent = bgVolSlider.value + '%';
  if (!state.bgMuted) bgVideo.volume = bgVolSlider.value / 100;
});

bgOpacity.addEventListener('input', () => {
  bgVideo.style.opacity = bgOpacity.value / 100;
  bgOpacityVal.textContent = bgOpacity.value + '%';
});

bannerHCtrl.addEventListener('input', () => {
  const h = bannerHCtrl.value + 'px';
  bannerWrap.style.height = h;
  bannerHVal.textContent = h;
});

// ══════════════════════════════════════════════
//  プレイリスト描画
// ══════════════════════════════════════════════
function renderLists() {
  renderMainList();
  renderFavList();
}

function renderMainList() {
  playlistUl.innerHTML = '';
  state.playlist.forEach((track, i) => {
    const li = makeTrackItem(track, i, i, 'main', false);
    playlistUl.appendChild(li);
  });
}

function renderFavList() {
  favoritesUl.innerHTML = '';
  // favOrderを最新のfavorite状態と同期
  state.favOrder = state.favOrder.filter(i => state.playlist[i] && state.playlist[i].favorite);
  state.playlist.forEach((t, i) => {
    if (t.favorite && !state.favOrder.includes(i)) state.favOrder.push(i);
  });

  state.favOrder.forEach((realIdx, pos) => {
    const track = state.playlist[realIdx];
    if (!track) return;
    const li = makeTrackItem(track, realIdx, pos, 'fav', true);
    favoritesUl.appendChild(li);
  });
}

function makeTrackItem(track, realIdx, pos, listType, draggable) {
  const li = document.createElement('li');
  li.className = 'track-item' + (state.currentIndex === realIdx ? ' active' : '');
  li.dataset.index = realIdx;
  li.dataset.pos = pos;

  const isActive = state.currentIndex === realIdx;

  li.innerHTML = `
    ${draggable ? '<span class="drag-handle" title="長押しで並び替え">⠿</span>' : ''}
    <div class="track-num">
      ${isActive && state.isPlaying
        ? `<div class="playing-bars"><span></span><span></span><span></span></div>`
        : (pos + 1)}
    </div>
    <div class="track-info">
      <div class="track-name">${track.title}</div>
      <div class="track-artist-small">${track.artist}</div>
    </div>
    <button class="fav-btn ${track.favorite ? 'favorited' : ''}" data-idx="${realIdx}">♥</button>
  `;

  li.addEventListener('click', (e) => {
    if (e.target.classList.contains('fav-btn') || e.target.classList.contains('drag-handle')) return;
    state.activeList = listType;
    playTrack(realIdx);
  });

  li.querySelector('.fav-btn').addEventListener('click', () => {
    state.playlist[realIdx].favorite = !state.playlist[realIdx].favorite;
    renderLists();
  });

  if (draggable) setupDrag(li, favoritesUl);
  return li;
}

// ══════════════════════════════════════════════
//  ドラッグ＆ドロップ（お気に入り並び替え）
//  ※ ハンドル(⠿)を掴んだ時だけドラッグ、それ以外はリスト普通にスクロール
// ══════════════════════════════════════════════
let dragSrc = null;
let isDraggingFav = false;
let dragStartY = 0;
let dragHandleActive = false;

function setupDrag(li, ul) {
  li.setAttribute('draggable', 'false');

  const handle = li.querySelector('.drag-handle');
  if (!handle) return;

  // ── デスクトップ: ハンドルからのみドラッグ許可 ──
  handle.addEventListener('mousedown', () => {
    li.setAttribute('draggable', 'true');
  });

  li.addEventListener('dragstart', (e) => {
    dragSrc = li;
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });

  li.addEventListener('dragend', () => {
    li.setAttribute('draggable', 'false');
    li.classList.remove('dragging');
    ul.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    dragSrc = null;
  });

  li.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!dragSrc || dragSrc === li) return;
    ul.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    li.classList.add('drag-over');
  });

  li.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!dragSrc || dragSrc === li) return;
    const fromPos = parseInt(dragSrc.dataset.pos);
    const toPos   = parseInt(li.dataset.pos);
    const moved = state.favOrder.splice(fromPos, 1)[0];
    state.favOrder.splice(toPos, 0, moved);
    renderFavList();
  });

  // ── タッチ: ハンドルを触った時だけドラッグモード ──
  handle.addEventListener('touchstart', (e) => {
    dragHandleActive = true;
    isDraggingFav = false;
    dragSrc = li;
    dragStartY = e.touches[0].clientY;
  }, { passive: true });

  handle.addEventListener('touchmove', (e) => {
    if (!dragHandleActive) return;
    // スクロールではなくドラッグと判断
    if (!isDraggingFav) {
      isDraggingFav = true;
      li.classList.add('dragging');
    }
    // リストのスクロールを止める（ドラッグ中のみ）
    e.preventDefault();
    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const targetLi = target ? target.closest('.track-item') : null;
    ul.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (targetLi && targetLi !== li) targetLi.classList.add('drag-over');
  }, { passive: false });

  handle.addEventListener('touchend', (e) => {
    if (!dragHandleActive) return;
    dragHandleActive = false;
    if (isDraggingFav) {
      const touch = e.changedTouches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetLi = target ? target.closest('.track-item') : null;
      if (targetLi && targetLi !== li) {
        const fromPos = parseInt(li.dataset.pos);
        const toPos   = parseInt(targetLi.dataset.pos);
        if (!isNaN(fromPos) && !isNaN(toPos)) {
          const moved = state.favOrder.splice(fromPos, 1)[0];
          state.favOrder.splice(toPos, 0, moved);
        }
      }
      li.classList.remove('dragging');
      ul.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      isDraggingFav = false;
      dragSrc = null;
      renderFavList();
    }
  });
}

// ══════════════════════════════════════════════
//  再生制御
// ══════════════════════════════════════════════
function playTrack(idx) {
  if (idx < 0 || idx >= state.playlist.length) return;
  state.currentIndex = idx;
  const track = state.playlist[idx];

  if (!vizReady) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      vizReady = true;
      if (animId) cancelAnimationFrame(animId);
      drawViz();
    } catch(e) { console.warn('Web Audio API 初期化エラー:', e); }
  }

  audio.src = track.file;
  audio.load();
  audio.play().then(() => {
    state.isPlaying = true;
    updatePlayBtn();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }).catch(e => console.warn('再生エラー:', e));

  trackTitle.textContent  = track.title;
  trackArtist.textContent = track.artist;
  renderLists();
}

function togglePlay() {
  if (!audio.src || audio.src === window.location.href) return;
  if (state.isPlaying) {
    audio.pause();
    state.isPlaying = false;
  } else {
    audio.play();
    state.isPlaying = true;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  updatePlayBtn();
}

function updatePlayBtn() {
  btnPlay.textContent = state.isPlaying ? '⏸' : '▶';
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (state.activeList === 'fav') {
    const cur = state.favOrder.indexOf(state.currentIndex);
    const prev = (cur - 1 + state.favOrder.length) % state.favOrder.length;
    playTrack(state.favOrder[prev]);
    return;
  }
  let idx = state.currentIndex - 1;
  if (idx < 0) idx = state.playlist.length - 1;
  playTrack(idx);
}

function nextTrack() {
  if (state.activeList === 'fav') {
    if (state.favShuffle) {
      const i = Math.floor(Math.random() * state.favOrder.length);
      playTrack(state.favOrder[i]);
      return;
    }
    const cur = state.favOrder.indexOf(state.currentIndex);
    const next = (cur + 1) % state.favOrder.length;
    playTrack(state.favOrder[next]);
    return;
  }
  if (state.shuffle || state.plShuffle) {
    playTrack(Math.floor(Math.random() * state.playlist.length));
    return;
  }
  let idx = state.currentIndex + 1;
  if (idx >= state.playlist.length) idx = 0;
  playTrack(idx);
}

audio.addEventListener('ended', () => {
  if (state.repeat === 'one') { audio.play(); return; }
  nextTrack();
});

// ══════════════════════════════════════════════
//  ボタンイベント
// ══════════════════════════════════════════════
btnPlay.addEventListener('click', togglePlay);
btnPrev.addEventListener('click', prevTrack);
btnNext.addEventListener('click', nextTrack);

btnShuffle.addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  btnShuffle.classList.toggle('active', state.shuffle);
});

btnRepeat.addEventListener('click', () => {
  const modes = ['none','all','one'];
  const i = (modes.indexOf(state.repeat) + 1) % modes.length;
  state.repeat = modes[i];
  btnRepeat.textContent = state.repeat === 'one' ? '↺¹' : '↺';
  btnRepeat.classList.toggle('active', state.repeat !== 'none');
});

function toggleMiniBtn(btn, key) {
  state[key] = !state[key];
  btn.classList.toggle('active', state[key]);
}
plShuffle.addEventListener('click', () => toggleMiniBtn(plShuffle, 'plShuffle'));
plRepeat.addEventListener('click',  () => toggleMiniBtn(plRepeat,  'plRepeat'));
favShuffle.addEventListener('click',() => toggleMiniBtn(favShuffle,'favShuffle'));
favRepeat.addEventListener('click', () => toggleMiniBtn(favRepeat, 'favRepeat'));

// ══════════════════════════════════════════════
//  シークバー
// ══════════════════════════════════════════════
let seeking = false;
seekBar.addEventListener('mousedown', () => { seeking = true; });
seekBar.addEventListener('mouseup', () => {
  seeking = false;
  audio.currentTime = seekBar.value / 100 * audio.duration;
});
seekBar.addEventListener('touchstart', () => { seeking = true; }, { passive: true });
seekBar.addEventListener('touchend', () => {
  seeking = false;
  audio.currentTime = seekBar.value / 100 * audio.duration;
});

audio.addEventListener('timeupdate', () => {
  if (seeking || !audio.duration) return;
  const pct = audio.currentTime / audio.duration * 100;
  seekBar.value = pct;
  seekBar.style.setProperty('--prog', pct + '%');
  timeCur.textContent = fmt(audio.currentTime);
  timeTot.textContent = fmt(audio.duration);
});

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

// ══════════════════════════════════════════════
//  音量・速度
// ══════════════════════════════════════════════
musicVol.addEventListener('input', () => {
  audio.volume = musicVol.value / 100;
  volVal.textContent = musicVol.value + '%';
});
audio.volume = musicVol.value / 100;

speedCtrl.addEventListener('input', () => {
  audio.playbackRate = parseFloat(speedCtrl.value);
  speedVal.textContent = parseFloat(speedCtrl.value).toFixed(1) + 'x';
});

// ══════════════════════════════════════════════
//  ビジュアライザー
// ══════════════════════════════════════════════
let audioCtx, analyser, source, animId;
let vizReady = false;

function setupVisualizer() {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  drawIdle();
}

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--viz-h')) || 90;
}

const dataArr = new Uint8Array(128);

function drawViz() {
  animId = requestAnimationFrame(drawViz);
  analyser.getByteFrequencyData(dataArr);
  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  const bars = dataArr.length;
  const barW = W / bars;
  for (let i = 0; i < bars; i++) {
    const val  = dataArr[i] / 255;
    const barH = val * H * 0.9;
    const hue  = 170 + i * 1.2;
    const alpha = 0.5 + val * 0.5;
    ctx2d.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
    ctx2d.fillRect(i * barW, H - barH, barW - 1, barH);
    ctx2d.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha * 0.2})`;
    ctx2d.fillRect(i * barW, 0, barW - 1, barH * 0.25);
  }
}

function drawIdle() {
  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  const bars = 64, barW = W / bars, t = Date.now() / 1000;
  for (let i = 0; i < bars; i++) {
    const val = (Math.sin(i * 0.3 + t * 1.5) + 1) / 2 * 0.15;
    ctx2d.fillStyle = `hsla(${180 + i * 2}, 80%, 55%, 0.3)`;
    ctx2d.fillRect(i * barW, H - val * H, barW - 1, val * H);
  }
  if (!vizReady) requestAnimationFrame(drawIdle);
}

init();
</script>
